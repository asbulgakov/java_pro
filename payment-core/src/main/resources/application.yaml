spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/java_pro
    username: user
    password: password

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: payment
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    location: classpath:db/migration

services:
  product-service:
    url: http://localhost:8081

server:
  port: 8080